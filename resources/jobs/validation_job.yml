# Solo QA: pruebas Spark con datos sintéticos y comprobación del dataset publicado.
targets:
  qa:
    resources:
      jobs:
        validation_job:
          name: applebees_validation
          max_concurrent_runs: 1
          tasks:
            - task_key: regression
              notebook_task:
                notebook_path: ../../tests/acceptance/validate_pipeline.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
              max_retries: 0
            - task_key: explore_tables
              depends_on:
                - task_key: regression
              notebook_task:
                notebook_path: ../../exploration/01_aplanado_eda.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
              max_retries: 0
            - task_key: explore_quality
              depends_on:
                - task_key: regression
              notebook_task:
                notebook_path: ../../exploration/02_calidad_eda.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
              max_retries: 0
            - task_key: explore_business
              depends_on:
                - task_key: regression
              notebook_task:
                notebook_path: ../../exploration/03_eda_descuentos.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
              max_retries: 0
